<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Clebet</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700;800&family=IBM+Plex+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef2ea;--surf:#fff;--ink:#17231b;--mut:#5d6b61;--line:#d5ddd0;--pitch:#1d6a3b;--pk:#fff;--card:#f2c230;--paper:#fffdf4;--bad:#b3261e;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1712;--surf:#17211a;--ink:#e8efe9;--mut:#9db0a2;--line:#2a382d;--pitch:#3fa468;--pk:#07140c;--paper:#1d241e;--bad:#ff8a80;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f1712;--surf:#17211a;--ink:#e8efe9;--mut:#9db0a2;--line:#2a382d;--pitch:#3fa468;--pk:#07140c;--paper:#1d241e;--bad:#ff8a80;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 "Bricolage Grotesque",system-ui,-apple-system,"Segoe UI",sans-serif}
.wrap{max-width:980px;margin:0 auto;padding:16px 16px 40px}
.hd{color:#fff;background:repeating-linear-gradient(90deg,#ffffff0a 0 48px,transparent 48px 96px),radial-gradient(ellipse 60% 140% at 50% 50%,#0f5a30 0%,#06200f 55%,#000 100%);border-bottom:3px solid #0a8f3c}.logoimg{height:84px;width:auto;display:block}@media(max-width:560px){.logoimg{height:64px}.who span{display:none}}
.hdin{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:12px;padding:22px 16px;max-width:980px;margin:0 auto}.hdin .who{justify-self:end}.logobtn{background:none;border:0;padding:0;cursor:pointer;display:block}
.logo{display:flex;align-items:center;gap:8px;font-weight:800;font-size:1.7rem;letter-spacing:-.03em;font-style:italic}
.logo b{color:#8fe3a8}
.who{display:flex;gap:10px;align-items:center;font-size:.95rem}
.hd .sec{background:transparent;color:#fff;border-color:#ffffff66}
nav{display:flex;gap:6px;overflow-x:auto;border-bottom:2px solid var(--line);margin:16px 0 20px}
nav button{background:none;border:0;padding:10px 14px;font:inherit;font-weight:600;color:var(--mut);cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-2px;white-space:nowrap}
nav button.on{color:var(--ink);border-color:var(--pitch)}
button,input,select,textarea{font:inherit}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--card);outline-offset:2px}
.grid{display:grid;grid-template-columns:1fr 320px;gap:20px;align-items:start}
@media(max-width:780px){.grid{grid-template-columns:1fr}}
.game,.box{background:var(--surf);border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin-bottom:12px}
.game h3{margin:2px 0 10px;font-size:1.1rem}
.box h2,.box h3{margin-top:0}
.meta,.mut,small{color:var(--mut);font-size:.85rem}
.odds{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.odd{display:flex;flex-direction:column;align-items:center;gap:2px;min-height:56px;padding:8px 4px;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:8px;cursor:pointer}
.odd span{font-size:.8rem;color:var(--mut);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.odd b{font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:1.1rem}
.odd.on{background:var(--pitch);color:var(--pk);border-color:var(--pitch)}
.odd.on span{color:var(--pk)}
.slip,.ticket{background:var(--paper);border:1px dashed var(--mut);border-radius:4px;padding:16px;font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:.88rem}
.slip h2,.ticket h3{margin:0 0 10px;font-family:"Bricolage Grotesque",system-ui,sans-serif;font-size:1.15rem}
.line{display:flex;justify-content:space-between;gap:8px;padding:8px 0;border-bottom:1px dashed var(--line)}
.x{background:none;border:0;color:var(--bad);font-size:1.2rem;cursor:pointer;min-width:32px;min-height:32px}
label{display:block;margin-top:10px;font-weight:600}
input,select,textarea{width:100%;padding:10px;border:1px solid var(--line);border-radius:6px;background:var(--surf);color:var(--ink);margin-top:4px}
textarea{font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:.85rem;resize:vertical}
.tot{display:flex;justify-content:space-between;margin-top:10px;font-size:1rem}
.main{width:100%;margin-top:14px;min-height:46px;background:var(--pitch);color:var(--pk);border:0;border-radius:8px;font-weight:700;cursor:pointer}
.sec{min-height:40px;padding:6px 14px;background:var(--surf);color:var(--ink);border:1px solid var(--line);border-radius:8px;cursor:pointer;font-weight:600}
.sec.go{background:var(--pitch);color:var(--pk);border-color:var(--pitch)}
.code{font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:1.8rem;font-weight:600;letter-spacing:.08em;text-align:center;padding:12px;background:var(--card);color:#1a1a1a;border-radius:6px;margin:8px 0}
.chip{display:inline-block;padding:2px 10px;border-radius:99px;font-size:.8rem;font-weight:700;background:var(--line);color:var(--ink)}
.chip.ganhou{background:var(--pitch);color:var(--pk)}.chip.perdeu{background:var(--bad);color:var(--bg)}
.banner{background:var(--surf);border-left:5px solid var(--card);padding:10px 14px;margin-bottom:16px;border-radius:4px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:end}.row>*{flex:1;min-width:110px}
.btns{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px;align-items:center}
.rk{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--line)}
.login{max-width:380px;margin:6vh auto 0}
.login h1{font-size:1.8rem;margin:0 0 4px;letter-spacing:-.02em}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.foot{margin-top:28px;text-align:center}.acct{background:var(--surf);border-bottom:1px solid var(--line);padding:8px 16px;font-size:.88rem;text-align:center;color:var(--mut)}.acct b{color:var(--ink)}
</style>
</head>

function slipOdd(){return slip.reduce(function(a,s){return a*o(G(s.g),s.p)},1)}
function st(t){if(t.recusado)return"recusado";if(!t.validado)return"aguardando validação";var pend=false;for(var i=0;i<t.selecoes.length;i++){var x=t.selecoes[i],g=G(x.jogo_id);if(!g||g.resultado==null)pend=true;else if(g.resultado!==x.escolha)return"perdeu"}return pend?"em jogo":"ganhou"}
function ticketText(t){return"CLEBET - Bilhete "+t.codigo+"\nNome: "+t.nome+"\n\nJogos:\n"+t.selecoes.map(function(x,i){return(i+1)+") "+x.casa+" x "+x.fora+" - "+pe(x)+" ("+f(x.cota)+")"}).join("\n")+"\n\nCotação total: "+f(t.cotacao)+"\nAposta: "+f(t.valor)+" fichas\nRetorno possível: "+f(t.valor*t.cotacao)+" fichas\nCódigo: "+t.codigo+"\n(Fichas virtuais, sem dinheiro real)"}

async function loadGames(){var r=await sb.from("jogos").select("*").order("id");if(r.error){msg="Não foi possível carregar os jogos. Tente de novo em instantes."}else games=r.data}
async function loadTickets(){if(!me)return;var r=await sb.from("bilhetes").select("*").order("criado_em",{ascending:false}).limit(300);if(r.error)msg="Não foi possível carregar os bilhetes.";else tickets=r.data}
async function loadMe(){var r=await sb.auth.getSession(),s=r.data.session;if(!s){me=null;return}var p=await sb.from("perfis").select("nome,papel").eq("id",s.user.id).maybeSingle();if(p.data)me={id:s.user.id,email:s.user.email,nome:p.data.nome,papel:p.data.papel};else{me=null;await sb.auth.signOut()}}

function head(){var r;if(me)r='<span>'+esc(me.nome)+'</span><button class="sec" data-a="out">Sair</button>';else if(view==="pub")r='<button class="sec" data-a="alog">Login</button>';else r='<button class="sec" data-a="home">Voltar ao site</button>';return'<div class="hd"><div class="hdin"><span></span><button class="logobtn" data-a="logo" aria-label="Ir para a página inicial">'+LOGO+'</button><div class="who">'+r+'</div></div></div>'}
function tabs(list){return'<nav>'+list.map(function(t){return'<button class="'+(tab===t[0]?"on":"")+'" data-a="tab" data-t="'+t[0]+'">'+t[1]+'</button>'}).join("")+'</nav>'+(msg?'<div class="banner" role="status">'+msg+'</div>':'')}
function alogin(){return'<div class="login"><h1>Login</h1><p class="mut">Só quem recebeu um acesso autorizado consegue entrar.</p>'+(msg?'<div class="banner" role="alert">'+msg+'</div>':'')+'<label>E-mail<input id="lu" type="email" autocomplete="username" autocapitalize="none"></label><label>Senha<input id="lp" type="password" autocomplete="current-password"></label><button class="main" data-a="login">Entrar</button></div>'}
function game(g){var b;if(g.resultado!=null)b='<p class="mut">Encerrado: '+(g.resultado==="X"?"empate":"vitória de "+esc(pn(g,g.resultado)))+'</p>';else b='<div class="odds">'+["1","X","2"].map(function(p){var on=slip.some(function(s){return s.g===g.id&&s.p===p});return'<button class="odd'+(on?" on":"")+'" data-a="pick" data-g="'+g.id+'" data-p="'+p+'"><span>'+esc(pn(g,p))+'</span><b>'+f(o(g,p))+'</b></button>'}).join("")+'</div>';return'<article class="game"><div class="meta">'+esc(g.campeonato)+'</div><h3>'+esc(g.casa)+' x '+esc(g.fora)+'</h3>'+b+'</article>'}
function slipH(){var t=slipOdd(),h='<aside class="slip"><h2>Seu bilhete</h2>';if(!slip.length)return h+'<p class="mut">Toque numa cotação para adicionar um jogo.</p></aside>';
h+=slip.map(function(s){var g=G(s.g);return'<div class="line"><div>'+esc(g.casa)+' x '+esc(g.fora)+'<br><small>'+esc(pn(g,s.p))+'</small></div><div><b>'+f(o(g,s.p))+'</b><button class="x" data-a="rm" data-g="'+s.g+'" aria-label="Remover jogo">×</button></div></div>'}).join("");
return h+'<label>Seu nome<input id="nm" value="'+esc(form.name)+'"></label><label>Valor da aposta (fichas)<input id="sk" type="number" min="1" value="'+form.stake+'"></label><div class="tot"><span>Cotação total</span><b>'+f(t)+'</b></div><div class="tot"><span>Retorno possível</span><b id="ret">'+f(t*form.stake)+'</b></div><button class="main" data-a="gen">Gerar bilhete</button></aside>'}
function tk(t){var s=st(t),c=s==="ganhou"?"ganhou":s==="perdeu"||s==="recusado"?"perdeu":"";return'<div class="ticket" style="margin-bottom:12px"><div class="top"><h3>'+esc(t.codigo)+'</h3><span class="chip '+c+'">'+s+'</span></div><div>'+esc(t.nome)+'</div>'+t.selecoes.map(function(x){return'<div class="line"><span>'+esc(x.casa)+' x '+esc(x.fora)+'</span><span>'+esc(pe(x))+'</span></div>'}).join("")+'<div class="tot"><span>Aposta '+f(t.valor)+' × '+f(t.cotacao)+'</span><b>'+f(t.valor*t.cotacao)+'</b></div>'+(!t.validado&&!t.recusado?'<div class="btns"><button class="sec go" data-a="val" data-c="'+esc(t.codigo)+'">Validar</button><button class="sec" data-a="rej" data-c="'+esc(t.codigo)+'">Recusar</button></div>':'')+'</div>'}
function ready(){var t=last;if(!t)return"";return'<div class="box"><h2>Bilhete gerado</h2><p>Envie este texto ao administrador para ele validar:</p><div class="code">'+esc(t.codigo)+'</div><textarea id="tt" readonly rows="11">'+esc(ticketText(t))+'</textarea><button class="main" data-a="copy">Copiar bilhete</button><button class="sec" style="margin-top:8px;width:100%" data-a="new">Fazer novo bilhete</button></div>'}
function list(){return loading?'<p class="mut">Carregando jogos…</p>':games.length?games.map(game).join(""):'<p class="mut">Nenhum jogo disponível no momento.</p>'}
function pub(){var h=msg?'<div class="banner" role="status">'+msg+'</div>':'';if(tab==="pronto")return h+ready();return h+'<div class="grid"><div>'+list()+'</div>'+slipH()+'</div>'}
function adm(){var h=tabs(me.papel==="admin"?[["validar","Validar"],["novo","Novo bilhete"],["bilhetes","Bilhetes"],["jogos","Jogos"]]:[["validar","Validar"],["novo","Novo bilhete"],["bilhetes","Bilhetes"]]);
if(tab==="pronto")return h+ready();if(tab==="novo")return h+'<div class="grid"><div>'+list()+'</div>'+slipH()+'</div>';
if(tab==="validar"){var pend=tickets.filter(function(t){return!t.validado&&!t.recusado});var ft=found&&tickets.filter(function(t){return t.codigo===found})[0];
return h+'<div class="box"><div class="row"><label>Código ou bilhete colado<input id="fc" autocapitalize="characters" placeholder="BL-XXXXXX"></label><button class="sec go" data-a="find">Buscar</button></div></div>'+(ft?tk(ft):'')+'<h2>Aguardando validação ('+pend.length+')</h2>'+(pend.length?pend.map(tk).join(""):'<p class="mut">Nenhum bilhete pendente.</p>')}
if(tab==="bilhetes")return h+(tickets.length?tickets.map(tk).join(""):'<p class="mut">Nenhum bilhete ainda.</p>');
if(tab==="jogos"&&me.papel==="admin")return h+'<div class="box"><h3>Criar evento</h3><div class="row"><label>Campeonato<input id="e-l"></label><label>Time da casa<input id="e-h"></label><label>Time de fora<input id="e-a"></label></div><div class="row"><label>Cotação casa<input id="e-1" inputmode="decimal"></label><label>Cotação empate<input id="e-x" inputmode="decimal"></label><label>Cotação fora<input id="e-2" inputmode="decimal"></label></div><button class="main" data-a="add">Adicionar evento</button></div>'+games.map(function(g){return'<article class="game"><div class="meta">'+esc(g.campeonato)+'</div><h3>'+esc(g.casa)+' x '+esc(g.fora)+'</h3>'+(g.resultado!=null?'<p class="mut">Resultado: '+(g.resultado==="X"?"empate":"vitória de "+esc(pn(g,g.resultado)))+'</p>':'<div class="btns"><span class="mut">Registrar resultado:</span>'+["1","X","2"].map(function(p){return'<button class="sec" data-a="res" data-g="'+g.id+'" data-p="'+p+'">'+esc(pn(g,p))+'</button>'}).join("")+'</div>')+'</article>'}).join("");
return h}
function render(){var b=me?adm():view==="alogin"?alogin():pub();$("#app").innerHTML=head()+(me?'<div class="acct">Conectado como <b>'+esc(me.email)+'</b> ('+(me.papel==="admin"?"administrador":"equipe")+')</div>':'')+'<div class="wrap">'+b+'<p class="mut foot">Clebet é um jogo entre amigos com fichas virtuais. Não há depósito, saque nem dinheiro real.</p></div>'}

document.addEventListener("input",function(e){if(e.target.id==="nm")form.name=e.target.value;if(e.target.id==="sk"){form.stake=Math.max(0,parseFloat(e.target.value)||0);var r=$("#ret");if(r)r.textContent=f(slipOdd()*form.stake)}});
document.addEventListener("keydown",function(e){if(e.key!=="Enter")return;if(e.target.id==="lp"||e.target.id==="lu")document.querySelector('[data-a="login"]').click();if(e.target.id==="fc")document.querySelector('[data-a="find"]').click()});
function num(id){return parseFloat(($(id).value||"").replace(",","."))}
function copyIt(txt){var ok=function(){msg="Bilhete copiado.";render()},fb=function(){var ta=$("#tt");ta.select();var r=false;try{r=document.execCommand("copy")}catch(e){}if(r)ok();else{msg="Não deu para copiar sozinho. Toque no texto acima, selecione tudo e escolha Copiar.";render()}};if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(txt).then(ok,fb);else fb()}
document.addEventListener("click",async function(e){var b=e.target.closest("[data-a]");if(!b||busy)return;var a=b.dataset.a,d=b.dataset;
if(a==="copy"){copyIt(ticketText(last));return}
msg="";busy=true;
try{
if(a==="alog"){view="alogin"}
else if(a==="home"){view="pub";tab="jogos"}
else if(a==="logo"){view="pub";tab=me?"validar":"jogos";found=null;await loadGames();await loadTickets()}
else if(a==="login"){var lr=await sb.auth.signInWithPassword({email:$("#lu").value.trim(),password:$("#lp").value});if(lr.error)msg="E-mail ou senha incorretos. Confira e tente de novo.";else{await loadMe();if(me){tab="validar";view="pub";await loadTickets()}else{msg="Esse acesso não está autorizado.";await sb.auth.signOut()}}}
else if(a==="out"){await sb.auth.signOut();me=null;tickets=[];view="pub";tab="jogos";found=null}
else if(a==="tab"){tab=d.t;found=null;if(tab==="novo"||tab==="jogos")await loadGames();if(tab==="validar"||tab==="bilhetes")await loadTickets()}
else if(a==="pick"){var g=+d.g,i=-1;slip.forEach(function(s,k){if(s.g===g)i=k});if(i<0)slip.push({g:g,p:d.p});else if(slip[i].p===d.p)slip.splice(i,1);else slip[i].p=d.p}
else if(a==="rm"){slip=slip.filter(function(s){return s.g!==+d.g})}
else if(a==="gen"){var nm=form.name.trim();if(!nm)msg="Escreva o nome de quem está apostando.";else if(!(form.stake>0))msg="Informe um valor de aposta maior que zero.";else if(!slip.length)msg="Escolha pelo menos um jogo.";else{var r=await sb.rpc("criar_bilhete",{p_nome:nm,p_valor:form.stake,p_selecoes:slip.map(function(s){return{jogo_id:s.g,escolha:s.p}})});if(r.error)msg=esc(r.error.message);else{last=r.data;slip=[];if(me){tab="bilhetes";msg="Bilhete "+last.codigo+" criado e validado.";await loadTickets()}else tab="pronto"}}}
else if(a==="new"){tab=me?"novo":"jogos";await loadGames()}
else if(a==="find"){await loadTickets();var q=(($("#fc").value||"").toUpperCase().match(/BL-[A-Z0-9]{6}/)||[""])[0];if(q&&tickets.some(function(t){return t.codigo===q}))found=q;else{found=null;msg="Nenhum bilhete com esse código. Confira se copiou certo."}}
else if(a==="val"){var vr=await sb.rpc("validar_bilhete",{p_codigo:d.c});if(vr.error)msg=esc(vr.error.message);else{msg="Bilhete "+d.c+" validado.";await loadTickets()}}
else if(a==="rej"){if(confirm("Recusar o bilhete "+d.c+"?")){var jr=await sb.rpc("recusar_bilhete",{p_codigo:d.c});if(jr.error)msg=esc(jr.error.message);else{msg="Bilhete "+d.c+" recusado.";await loadTickets()}}}
else if(a==="add"){var l=$("#e-l").value.trim(),h=$("#e-h").value.trim(),aw=$("#e-a").value.trim(),o1=num("#e-1"),ox=num("#e-x"),o2=num("#e-2");if(!l||!h||!aw)msg="Preencha campeonato e os dois times.";else if(!(o1>1&&ox>1&&o2>1))msg="As três cotações precisam ser maiores que 1,00.";else{var ar=await sb.from("jogos").insert({campeonato:l,casa:h,fora:aw,cota_casa:o1,cota_empate:ox,cota_fora:o2});if(ar.error)msg="Não foi possível adicionar o evento.";else{msg="Evento adicionado.";await loadGames()}}}
else if(a==="res"){var rr=await sb.from("jogos").update({resultado:d.p}).eq("id",+d.g);if(rr.error)msg="Não foi possível registrar o resultado.";else{msg="Resultado registrado.";await loadGames()}}
}catch(err){msg="Algo deu errado. Confira a conexão e tente de novo."}
busy=false;render()});
render();
(async function(){await Promise.all([loadGames(),loadMe()]);if(me){tab="validar";await loadTickets()}loading=false;render()})();
</script>
</body>
</html>
